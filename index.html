<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">

<title>juseikr · Jusei INA GO</title>
<meta name="description" content="juseikr — Go K-pop & merchandise dari Korea Selatan, China, Jepang, Taiwan, dan Thailand. Order, bayar, dan lacak pesanan dengan mudah.">
<meta name="theme-color" content="#ff7fb5">
<link rel="icon" href="/.netlify/images?url=/logo.jpg&w=64&fm=png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--pn:#fff1f7;--card:#fff;--in:#fff;--pk:#ff7fb5;--pk2:#ffd6e8;--lb:#d4146f;--tx:#2a1a22;--mu:#80606f;--ln:#ffe1ee;--sh:0 10px 28px rgba(255,127,181,.16);--ok:#1f9d6b;color-scheme:light}
[data-theme=dark]{--bg:#1c1116;--pn:#28171f;--card:#2f1c25;--in:#24151c;--pk2:#5a2e42;--lb:#ff8fc0;--tx:#ffeef5;--mu:#d3aabd;--ln:#46293a;--sh:0 10px 28px rgba(0,0,0,.35);--ok:#5fd3a3;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1116;--pn:#28171f;--card:#2f1c25;--in:#24151c;--pk2:#5a2e42;--lb:#ff8fc0;--tx:#ffeef5;--mu:#d3aabd;--ln:#46293a;--sh:0 10px 28px rgba(0,0,0,.35);--ok:#5fd3a3;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--lb)}
img{max-width:100%}
h1,h2,h3{line-height:1.2;margin:0}
.mu{color:var(--mu);font-size:14px}
.pre{white-space:pre-line}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Header */
#hd{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top,0px)}
#hd .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:8px 16px}
#hd .lg{height:38px;width:auto;border-radius:12px;display:block}
#hd .nm{font-weight:900;font-size:18px;letter-spacing:-.01em}
#hd .nm small{display:block;font-size:11px;color:var(--lb);font-weight:800;letter-spacing:.08em;margin-top:-2px}
#hd .sp{flex:1}
.ib{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);display:grid;place-items:center;cursor:pointer}
.ib svg{width:19px;height:19px}

main{max-width:980px;margin:0 auto;padding:14px 16px calc(120px + env(safe-area-inset-bottom,0px))}
.sec{margin:22px 0 10px;display:flex;align-items:end;justify-content:space-between;gap:10px}
.sec h2{font-size:22px;font-weight:900}
.eb{color:var(--lb);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase}

/* Cards */
.card{background:var(--card);border-radius:26px;padding:18px;margin:12px 0;box-shadow:var(--sh);border:1px solid var(--ln)}
.panel{background:var(--pn);border-radius:30px;padding:26px 16px;margin:18px 0;text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack>*+*{margin-top:10px}

/* Bubble icons */
.bub{width:54px;height:54px;flex:none;border-radius:50%;display:grid;place-items:center;color:#2a1a22;
 background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,.35) 12%,rgba(255,255,255,0) 19%),linear-gradient(155deg,#ffc9e0,#ff7fb5);
 box-shadow:0 9px 20px rgba(255,127,181,.38),inset 0 -4px 8px rgba(212,20,111,.14)}
.bub svg{width:25px;height:25px}
.bub.s{width:42px;height:42px}.bub.s svg{width:20px;height:20px}
.bub.l{width:68px;height:68px}.bub.l svg{width:30px;height:30px}
.fi{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--pn);color:var(--lb);box-shadow:0 5px 14px rgba(255,127,181,.24)}
.fi svg{width:21px;height:21px}

/* Buttons */
.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;
 background:linear-gradient(180deg,#ffaed1,#ff7fb5);color:#2a1a22;font:inherit;font-weight:800;font-size:15px;text-decoration:none;
 box-shadow:0 9px 20px rgba(255,127,181,.36);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 24px rgba(255,127,181,.44)}
.btn:active{transform:translateY(1px)}
.btn svg{width:17px;height:17px}
.btn.gh{background:var(--card);color:var(--tx);border:1.5px solid var(--ln);box-shadow:none}
.btn.sm{padding:8px 14px;font-size:13px}
.btn.w{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* Forms */
label.f{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--ln);border-radius:16px;background:var(--in);color:var(--tx);font:inherit;font-size:15px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pk);box-shadow:0 0 0 4px color-mix(in srgb,var(--pk) 22%,transparent)}
textarea{min-height:96px;resize:vertical}
.g2{display:grid;gap:0 10px;grid-template-columns:1fr 1fr}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;padding:12px 14px;border:1.5px solid var(--ln);border-radius:16px;cursor:pointer;font-weight:700;font-size:14px;background:var(--in)}
.seg input{width:auto;accent-color:var(--pk)}
.seg label:has(input:checked){border-color:var(--pk);background:var(--pn)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:var(--pn);color:var(--lb);font-weight:800;font-size:12px;white-space:nowrap}
.chip.ok{color:var(--ok)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{border:1.5px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
.chips button.on{background:linear-gradient(180deg,#ffaed1,#ff7fb5);border-color:transparent;color:#2a1a22}

/* Hero */
.hero{background:var(--pn);border-radius:30px;padding:26px 18px 24px;text-align:center;margin-top:6px;position:relative;overflow:hidden}
.hero .logo{width:min(250px,70%);border-radius:24px;box-shadow:var(--sh);display:block;margin:0 auto 14px}
.hero h1{font-size:30px;font-weight:900;letter-spacing:-.02em}
.hero p{margin:8px auto 18px;max-width:520px;color:var(--mu)}
.notice{display:flex;gap:12px;align-items:center}

/* Quick menu */
.qm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qm button{background:var(--card);border:1px solid var(--ln);border-radius:22px;box-shadow:var(--sh);padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;font:inherit;font-weight:800;font-size:13px;color:var(--tx);cursor:pointer}

/* Cara order */
.ct{font-size:26px;font-weight:900;margin:6px 0 18px}
.sg{display:grid;grid-template-columns:1fr;gap:12px;text-align:left;margin-bottom:20px}
.sc{display:flex;gap:16px;align-items:flex-start;background:var(--card);border-radius:26px;padding:18px;box-shadow:var(--sh)}
.sc b{display:block;font-size:17px;margin:1px 0 3px}
.lbl{color:var(--lb);font-weight:800;font-size:13px}
.fg{display:grid;grid-template-columns:1fr;gap:12px;margin:14px 0}
.fc{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--ln);border-radius:26px;padding:18px;background:var(--card)}
.fc b{display:block;font-size:16px}

/* Catalog */
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pc{background:var(--card);border-radius:26px;box-shadow:var(--sh);border:1px solid var(--ln);overflow:hidden;display:flex;flex-direction:column}
.pc .im{aspect-ratio:1;background:var(--pn);display:grid;place-items:center}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.pc .bd b{font-size:15px;line-height:1.3}
.pc .pr{font-weight:900;color:var(--lb);font-size:16px}
.pc .btn{margin-top:auto}

/* Cart lines */
.ln{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px dashed var(--ln)}
.ln:first-child{border-top:0}
.ln .t{flex:1;min-width:0}
.ln .t b{display:block;overflow-wrap:anywhere}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);cursor:pointer;display:grid;place-items:center}
.qty svg{width:14px;height:14px}
.tot{display:flex;justify-content:space-between;font-weight:900;font-size:17px;padding-top:12px;border-top:2px solid var(--ln);margin-top:6px}

/* Order / tracking */
.oh{display:flex;gap:12px;align-items:center;cursor:pointer}
.oh .t{flex:1;min-width:0}
.bar{height:8px;border-radius:9px;background:var(--pn);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffc9e0,#ff7fb5);border-radius:9px}
.det{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.det div{background:var(--pn);border-radius:16px;padding:10px 12px;font-weight:700;font-size:14px;overflow-wrap:anywhere}
.det small{display:block;color:var(--mu);font-weight:600;font-size:12px}
.det .wide{grid-column:1/-1}
.tl{position:relative;margin:8px 0 4px}
.st{display:flex;gap:14px;position:relative;padding-bottom:16px}
.st:not(:last-child)::before{content:"";position:absolute;left:20px;top:44px;bottom:2px;width:2px;background:var(--ln)}
.st.dn:not(:last-child)::before{background:var(--pk)}
.st .dot{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--pn);color:var(--mu);border:1.5px solid var(--ln)}
.st .dot svg{width:19px;height:19px}
.st.dn .dot{border:0;color:#2a1a22;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,0) 18%),linear-gradient(155deg,#ffc9e0,#ff7fb5);box-shadow:0 6px 14px rgba(255,127,181,.35)}
.st .bx{flex:1;min-width:0;padding-top:2px}
.st .bx>b{display:block}
.st.td .bx>b{color:var(--mu);font-weight:700}
.st.cur .bx>b{color:var(--lb)}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ph a{display:block}
.ph img{width:84px;height:84px;object-fit:cover;border-radius:16px;border:1px solid var(--ln)}
.inv{background:var(--pn);border-radius:20px;padding:14px;margin-top:10px}
.inv .ln{border-color:color-mix(in srgb,var(--pk) 35%,transparent)}

/* Admin */
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kp .card{margin:0;padding:14px 16px}
.kp b{display:block;font-size:22px;font-weight:900}
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--ln);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--mu);font-weight:800;font-size:12px}
td b{font-weight:900}
.al{display:flex;gap:10px;align-items:center;padding:12px;border-radius:18px;cursor:pointer;border:1.5px solid transparent}
.al:hover{background:var(--pn)}
.al.on{border-color:var(--pk);background:var(--pn)}
.al .t{flex:1;min-width:0}

/* Bottom nav */
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--ln);box-shadow:0 -8px 24px rgba(255,127,181,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
nav#nav .in{display:flex;gap:2px;overflow-x:auto;scroll-snap-type:x proximity;padding:8px 8px;scrollbar-width:none;max-width:980px;margin:0 auto}
nav#nav .in::-webkit-scrollbar{display:none}
.tab{flex:1 0 68px;scroll-snap-align:center;border:0;background:none;color:var(--mu);font:inherit;font-weight:700;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 2px}
.tab .bb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--pn);color:var(--mu);transition:transform .2s}
.tab .bb svg{width:20px;height:20px}
.tab.on{color:var(--pk)}
.tab.on .bb{color:#2a1a22;transform:translateY(-2px);background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,0) 18%),linear-gradient(155deg,#ffc9e0,#ff7fb5);box-shadow:0 7px 16px rgba(255,127,181,.42)}

#t{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#2a1a22;color:#fff;padding:11px 20px;border-radius:999px;font-weight:700;font-size:14px;z-index:40;transition:.25s;max-width:90vw;text-align:center}
#t.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:26px 16px}
.empty .bub{margin:0 auto 12px}
.warn{background:#fff6d6;color:#5b4300;border-radius:18px;padding:12px 14px;font-size:14px;margin:10px 0}
[data-theme=dark] .warn{background:#3b3216;color:#ffe7a3}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--pk2);border-top-color:var(--pk);animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}

@media(min-width:700px){
 .sg{grid-template-columns:1fr 1fr}
 .fg{grid-template-columns:repeat(3,1fr)}
 .pg{grid-template-columns:repeat(3,1fr)}
 .qm{grid-template-columns:repeat(6,1fr)}
 .kp{grid-template-columns:repeat(4,1fr)}
 .panel{padding:34px 28px}
 .hero{padding:36px 28px}
 .hero h1{font-size:38px}
 .ct{font-size:30px}
 .adm2{display:grid;grid-template-columns:320px 1fr;gap:14px;align-items:start}
}
@media(min-width:980px){.pg{grid-template-columns:repeat(4,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

/* ---------- Utilitas (semua input pengguna di-escape) ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"'`]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'}[c]));
const safeUrl = u => { try { const x = new URL(String(u||''), location.href); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch(e) { return ''; } };
const rp = n => 'Rp' + Math.round(Number(n)||0).toLocaleString('id-ID');
const val = id => { const e = document.getElementById(id); return e ? String(e.value||'').trim() : ''; };
const num = id => Math.max(0, Number(val(id).replace(/[^\d.]/g,'')) || 0);
const dt = t => t ? new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '-';
const dd = t => t ? new Date(t).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}) : '-';
const clean = o => { const {id, owner, ...r} = o; return r; };
const rid = (p='') => p + Date.now().toString(36).toUpperCase().slice(-5) + Math.random().toString(36).slice(2,5).toUpperCase();
const tot = it => (it||[]).reduce((s,i) => s + (Number(i.q)||0)*(Number(i.p)||0), 0);
let tT; const toast = m => { const t = $('#t'); t.textContent = m; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), 2800); };
const errMsg = e => (e && (e.message || e.error_description)) || 'Terjadi kesalahan';
const img = (u, w) => { const s = safeUrl(u); return s ? (w && s.startsWith(location.origin) ? `/.netlify/images?url=${encodeURIComponent(new URL(s).pathname)}&w=${w}&fm=webp` : s) : ''; };

/* ---------- Data (tabel kv) ---------- */
const kv = {
  async list(col) { const { data, error } = await SB.from('kv').select('id,owner,data,created_at').eq('col', col).order('created_at', {ascending:false}).limit(2000); if (error) throw error; return (data||[]).map(r => ({...r.data, id:r.id, owner:r.owner})); },
  async ins(col, id, data) { const { error } = await SB.from('kv').insert({col, id, owner:S.user.id, data}); if (error) throw error; },
  async upd(col, id, data) { const { error } = await SB.from('kv').update({data}).eq('col', col).eq('id', id); if (error) throw error; },
  async put(col, id, data) { const { error } = await SB.from('kv').upsert({col, id, owner:S.user.id, data}); if (error) throw error; },
  async del(col, id) { const { error } = await SB.from('kv').delete().eq('col', col).eq('id', id); if (error) throw error; }
};
async function upload(bucket, file) {
  if (!file) throw new Error('Pilih file dulu');
  if (!/^image\//.test(file.type)) throw new Error('File harus berupa gambar');
  if (file.size > 6e6) throw new Error('Ukuran gambar maksimal 6 MB');
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5) || 'jpg';
  const path = (bucket === 'bukti' ? S.user.id + '/' : '') + Date.now() + '-' + Math.random().toString(36).slice(2,8) + '.' + ext;
  const { error } = await SB.storage.from(bucket).upload(path, file, { contentType:file.type, upsert:false });
  if (error) throw error;
  return bucket === 'photos' ? SB.storage.from('photos').getPublicUrl(path).data.publicUrl : path;
}

async function load() {
  if (!READY) { S.loaded = true; return; }
  const cols = ['products','site'].concat(S.user ? ['orders','invoices','payments','ideas'] : []);
  const res = await Promise.all(cols.map(c => kv.list(c).catch(e => { console.warn(c, e); return []; })));
  const by = Object.fromEntries(cols.map((c,i) => [c, res[i]]));
  S.prods = by.products || [];
  const m = (by.site||[]).find(x => x.id === 'main');
  S.site = {...DEF, ...(m ? clean(m) : {})};
  S.orders = by.orders || []; S.invs = by.invoices || []; S.pays = by.payments || []; S.ideas = by.ideas || [];
  S.loaded = true;
}
async function init() {
  if (READY) {
    try {
      const { data:{ session } } = await SB.auth.getSession();
      S.user = session ? session.user : null;
      if (S.user) { const { data } = await SB.rpc('is_admin'); S.adm = !!data; }
    } catch(e) { console.warn(e); }
    SB.auth.onAuthStateChange((ev, s) => {
      if (ev === 'PASSWORD_RECOVERY') { setTimeout(async () => { const np = prompt('Masukkan password baru (minimal 6 karakter)'); if (np && np.length >= 6) { const r = await SB.auth.updateUser({ password:np }); toast(r.error ? errMsg(r.error) : 'Password berhasil diganti'); } }, 300); return; }
      if (ev === 'SIGNED_OUT' || (ev === 'SIGNED_IN' && !RECOVERY && (!S.user || S.user.id !== s.user.id))) location.reload();
    });
  }
  await load(); draw(true);
  setInterval(async () => { if (document.hidden || !READY) return; await load(); draw(); }, 30000);
}

  if ($('#hdLogo').getAttribute('src') !== logo) $('#hdLogo').src = logo;
  $('#navIn').innerHTML = tabs.map(t => `<button class="tab ${S.v===t[0]?'on':''}" data-go="${t[0]}" ${S.v===t[0]?'aria-current="page"':''}><span class="bb">${ico(t[2])}</span>${t[1]}</button>`).join('');

/* ---------- Tracking components ---------- */
const invOf = o => S.invs.find(i => i.id === o.id);
const paysOf = o => S.pays.filter(p => p.oid === o.id);
const stIdx = o => Math.max(0, ST.indexOf(o.status));
const STAGE_HINT = ['', 'Catatan box', 'Foto timbangan', 'Link CO Shopee', 'Nomor invoice', '', ''];

function timeline(o) {
  const k = stIdx(o), T = o.tl || {}, inv = invOf(o), ps = paysOf(o);
  return `<div class="tl">${ST.map((s,i) => {
    const t = T[i] || {}, dn = i <= k;
    let extra = '';
    if (t.note) extra += `<div class="mu pre">${i===1?'<b>Catatan box:</b> ':''}${esc(t.note)}</div>`;
    if (t.at && dn) extra += `<div class="mu" style="font-size:12px">${dt(t.at)}</div>`;
    if ((t.ph||[]).length) extra += `<div class="ph">${t.ph.map(u => safeUrl(u)).filter(Boolean).map(u => `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer"><img src="${esc(u)}" alt="Foto ${esc(s)}" loading="lazy"></a>`).join('')}</div>`;
    if (i === 3 && dn && safeUrl(o.coLink)) extra += `<div class="mu" style="margin-top:6px">${ico('link').replace('<svg','<svg width="14" height="14"')} <a href="${esc(safeUrl(o.coLink))}" target="_blank" rel="noopener noreferrer">Link CO Shopee</a></div>`;
    if (i === 4 && dn) extra += payBlock(o, k, inv, ps);
    return `<div class="st ${dn?'dn':'td'} ${i===k?'cur':''}"><div class="dot">${ico(ST_ICON[i])}</div><div class="bx"><b>${s}</b>${extra}</div></div>`;
  }).join('')}</div>`;
}

function payBlock(o, k, inv, ps) {
  let h = '';
  h += inv && (inv.confirmed || S.adm) ? `<div class="mu" style="margin-top:4px">Nomor invoice: <b>${esc(inv.no)}</b></div>` : `<div class="mu">Invoice sedang disiapkan admin.</div>`;
  if (k === 4 && inv && inv.confirmed) {
    const co = safeUrl(o.coLink);
    h += `<div class="btns" style="margin-top:10px">${co ? `<a class="btn sm" href="${esc(co)}" target="_blank" rel="noopener noreferrer">${ico('shop')} CO Pack di Shopee</a>` : ''}<button class="btn sm" data-a="payopen" data-i="${esc(o.id)}">${ico('card')} Bayar & Submit Pembayaran</button></div>`;
    if (S.pf === o.id) h += `<div class="inv"><div class="pre mu">${esc(S.site.payInfo)}</div>${safeUrl(S.site.qris) ? `<img src="${esc(safeUrl(S.site.qris))}" alt="QRIS" style="width:200px;border-radius:16px;margin:10px 0;background:#fff">` : ''}
      <label class="f" for="pb">Foto bukti transfer</label><input id="pb" type="file" accept="image/*">
      <label class="f" for="pm">Catatan (opsional)</label><input id="pm" maxlength="300" placeholder="mis. Transfer dari BCA a.n. ...">
      <div class="btns" style="margin-top:10px"><button class="btn sm" data-a="paysend" data-i="${esc(o.id)}">${ico('upload')} Kirim bukti</button><button class="btn gh sm" data-a="payclose">Batal</button></div></div>`;
  }
  if (ps.length) h += `<div style="margin-top:8px"><span class="chip ${k>4||ps.some(p=>p.verified)?'ok':''}">${ico('check').replace('<svg','<svg width="12" height="12"')} ${k>4||ps.some(p=>p.verified)?'Pembayaran terverifikasi':'Bukti terkirim · menunggu verifikasi'}</span></div>`;
  return h;
}

function invoiceCard(o) {
  const inv = invOf(o);
  if (!inv || (!inv.confirmed && !S.adm)) return `<div class="inv mu">${ico('receipt').replace('<svg','<svg width="16" height="16" style="vertical-align:-3px"')} Invoice akan tampil setelah dikonfirmasi admin.</div>`;
  const items = inv.items || o.items || [];
  return `<div class="inv"><div class="row"><b>${ico('receipt').replace('<svg','<svg width="16" height="16" style="vertical-align:-3px"')} Invoice ${esc(inv.no)}</b>${inv.confirmed?'<span class="chip ok">Terkonfirmasi</span>':'<span class="chip">Belum dikonfirmasi</span>'}</div>

    <div class="mu" style="margin-top:6px">Pembayaran: ${esc(o.pay)}</div></div>`;
}

home: () => {
  const s = S.site, logo = img(s.logo) || '/.netlify/images?url=/logo.jpg&w=520&fm=webp';
  return `<section class="hero"><img class="logo" src="${esc(logo)}" alt="Jusei INA GO" width="250" height="152"><h1>${esc(s.title)}</h1><p>${esc(s.sub)}</p><div class="btns" style="justify-content:center"><button class="btn" data-go="kat">Lihat katalog ${ico('arrow')}</button><button class="btn gh" data-go="trk">${ico('search')} Lacak pesanan</button></div></section>
  ${s.notice ? `<div class="card notice">${bub('megaphone','s')}<div class="pre">${esc(s.notice)}</div></div>` : ''}
  <div class="qm" style="margin-top:14px">${TABS.slice(1,7).map(t => `<button data-go="${t[0]}">${bub(t[2],'s')}${t[1]}</button>`).join('')}</div>
  ${S.prods.length ? head('Baru di katalog','Pilihan minggu ini', `<button class="btn gh sm" data-go="kat">Semua ${ico('arrow')}</button>`) + `<div class="pg">${S.prods.slice(0,4).map(prodCard).join('')}</div>` : ''}
  ${caraSec()}`;
},

kat: () => {
  const f = S.prods.filter(p => (S.kf === 'Semua' || p.c === S.kf) && (!S.kq || String(p.n).toLowerCase().includes(S.kq.toLowerCase())));
  const ep = S.ep ? S.prods.find(p => p.id === S.ep) || {} : {};
  return head('Katalog','Pilih item favoritmu') +
  (S.adm ? `<div class="card"><b>${S.ep ? 'Edit produk' : 'Tambah produk'}</b>
    <label class="f" for="pn">Nama produk</label><input id="pn" maxlength="140" value="${esc(ep.n||'')}">
    <div class="g2"><div><label class="f" for="pp">Harga (Rp)</label><input id="pp" inputmode="numeric" value="${esc(ep.p||'')}"></div><div><label class="f" for="pc">Negara asal</label><select id="pc">${negOpts(ep.c)}</select></div></div>
    <label class="f" for="pd">Deskripsi singkat</label><input id="pd" maxlength="200" value="${esc(ep.d||'')}">
    <label class="f" for="pi">Foto produk (opsional)</label><input id="pi" type="file" accept="image/*">
    <div class="btns" style="margin-top:12px"><button class="btn" data-a="saveprod">${ico('check')} Simpan produk</button>${S.ep?'<button class="btn gh" data-a="cancelprod">Batal</button>':''}</div></div>` : '') +
  `<div style="position:relative;margin:6px 0 10px"><input id="kq" placeholder="Cari produk..." value="${esc(S.kq)}" data-live="kq" aria-label="Cari produk"></div>
  <div class="chips">${['Semua'].concat(NEG).map(n => `<button class="${S.kf===n?'on':''}" data-a="kf" data-i="${esc(n)}">${esc(n)}</button>`).join('')}</div>
  ${f.length ? `<div class="pg">${f.map(prodCard).join('')}</div>` : `<div class="card empty">${bub('bag','l')}<h3>Belum ada produk di sini</h3><p class="mu">Item yang kamu cari belum ada? Tambahkan sebagai pesanan manual di tab Order.</p><button class="btn" data-go="order">Order manual ${ico('arrow')}</button></div>`}`;
},

order: () => {
  if (!S.user) return head('Order','Form pemesanan') + needLogin('Masuk dulu untuk order');
  const p = profile(), t = tot(S.cart);
  return head('Order','Form pemesanan') +
  `<div class="card"><div class="row"><b>Daftar pesanan</b><span class="chip">${S.cart.length} item</span></div>
    ${S.cart.length ? S.cart.map((i,x) => `<div class="ln"><div class="t"><b>${esc(i.n)}</b><div class="mu">${esc(i.c)} · ${rp(i.p)}${i.note?` · ${esc(i.note)}`:''}</div></div>
      <div class="qty"><button data-a="qm" data-i="${x}" aria-label="Kurangi">${ico('minus')}</button><b>${esc(i.q)}</b><button data-a="qp" data-i="${x}" aria-label="Tambah">${ico('plus')}</button><button data-a="rm" data-i="${x}" aria-label="Hapus">${ico('x')}</button></div></div>`).join('')
    : `<div class="mu" style="padding:10px 0">Belum ada barang. Pilih dari katalog atau tambahkan pesanan manual di bawah.</div><button class="btn gh sm" data-go="kat">${ico('grid')} Buka katalog</button>`}
    <div class="tot"><span>Estimasi</span><span>${rp(t)}</span></div></div>

  <div class="card"><b>Tambah pesanan manual</b><div class="mu">Untuk barang di luar katalog atau lanjutan pembelian sebelumnya.</div>
    <label class="f" for="mn">Nama barang</label><input id="mn" maxlength="140" placeholder="mis. Album XYZ — Photobook ver.">
    <label class="f" for="md">Detail / link / nomor pembelian sebelumnya</label><input id="md" maxlength="400" placeholder="Link produk, varian, atau no. pembelian">
    <div class="g2"><div><label class="f" for="mq">Jumlah</label><input id="mq" inputmode="numeric" value="1"></div><div><label class="f" for="mp">Harga perkiraan (Rp)</label><input id="mp" inputmode="numeric" placeholder="0"></div></div>
    <label class="f" for="mc">Negara</label><select id="mc">${negOpts()}</select>
    <button class="btn gh w" style="margin-top:12px" data-a="addman">${ico('plus')} Tambah ke daftar</button></div>

  <div class="card"><b>Data pengiriman & pembayaran</b>
    <label class="f" for="or">Nama penerima</label><input id="or" maxlength="100" value="${esc(p.name)}" autocomplete="name">
    <label class="f" for="oh">No. HP</label><input id="oh" maxlength="20" inputmode="tel" value="${esc(p.phone)}" autocomplete="tel">
    <label class="f" for="oa">Alamat lengkap</label><textarea id="oa" maxlength="600" placeholder="Jalan, RT/RW, kelurahan, kecamatan, kota, provinsi, kode pos" autocomplete="street-address"></textarea>
    <label class="f">Metode kirim</label><div class="seg">${SHIP.map((s,i) => `<label><input type="radio" name="os" value="${esc(s)}" ${i?'':'checked'}>${esc(s)}</label>`).join('')}</div>
    <label class="f" for="ot">No pesanan toko (opsional)</label><input id="ot" maxlength="80" placeholder="mis. nomor pesanan Shopee">
    <label class="f">Pembayaran</label><div class="seg">${['Transfer','QRIS'].map((s,i) => `<label><input type="radio" name="op" value="${s}" ${i?'':'checked'}>${s}</label>`).join('')}</div>
    <button class="btn w" style="margin-top:16px" data-a="checkout" ${S.busy?'disabled':''}>Buat pesanan ${ico('arrow')}</button>
    <div class="mu" style="margin-top:8px;text-align:center">Invoice dibuat otomatis dan tampil setelah dikonfirmasi admin.</div></div>`;
},

trk: () => {
  if (!S.user) return head('Tracking','Lacak pesananmu') + needLogin('Masuk untuk melihat pesananmu');
  const mine = S.adm ? S.orders.filter(o => o.owner === S.user.id) : S.orders;
  const q = S.tq.toUpperCase().replace(/^#/, '');
  const list = q ? mine.filter(o => o.id.toUpperCase().includes(q)) : mine;
  return head('Tracking','Lacak pesananmu') +
  `<div class="card"><label class="f" for="tq" style="margin-top:0">Cari dengan kode order</label><div class="row"><input id="tq" placeholder="mis. JKAB12C" value="${esc(S.tq)}"><button class="btn" data-a="find" aria-label="Cari">${ico('search')}</button></div></div>
  ${list.length ? list.map(orderCard).join('') : `<div class="card empty">${bub('box','l')}<h3>${q ? 'Kode order tidak ditemukan' : 'Belum ada pesanan'}</h3><p class="mu">${q ? 'Pastikan kode benar dan pesanan dibuat dari akun ini.' : 'Yuk mulai belanja, pesananmu akan muncul di sini.'}</p><button class="btn" data-go="kat">Mulai belanja ${ico('arrow')}</button></div>`}`;
},

ide: () => {
  if (!S.user) return head('Ideaku','Request item impianmu') + needLogin('Masuk untuk mengirim ide');
  const mine = S.ideas.filter(i => i.owner === S.user.id);
  return head('Ideaku','Request item impianmu') +
  `<div class="card"><div class="row" style="justify-content:flex-start;gap:12px">${bub('bulb','s')}<div class="mu">Ada album, merch pop-up, atau GO yang ingin kamu ikuti? Ceritakan di sini, admin akan meninjaunya.</div></div>
    <label class="f" for="it">Judul ide</label><input id="it" maxlength="120" placeholder="mis. GO lightstick versi 2">
    <label class="f" for="id">Detail</label><textarea id="id" maxlength="1500" placeholder="Link, negara asal, perkiraan harga, dan lain-lain"></textarea>
    <button class="btn w" style="margin-top:12px" data-a="addide">Kirim ide ${ico('arrow')}</button></div>
  ${mine.length ? head('Riwayat','Ide yang sudah kamu kirim') + mine.map(i => `<div class="card"><div class="row"><b>${esc(i.t)}</b><span class="mu" style="font-size:12px">${dd(i.at)}</span></div><div class="mu pre">${esc(i.d)}</div></div>`).join('') : ''}`;
},

cara: () => caraSec(),

tnc: () => head('TnC','Syarat & Ketentuan') + `<div class="card pre">${esc(S.site.tnc)}</div>`,

akun: () => {
  if (S.user) {
    const p = profile(), mine = S.orders.filter(o => o.owner === S.user.id);
    return head('Akun','Profil kamu') + `<div class="card" style="text-align:center">${bub('user','l').replace('class="bub l"','class="bub l" style="margin:0 auto 10px"')}<h3>${esc(p.name)}</h3>
      <div class="mu">${ico('mail').replace('<svg','<svg width="14" height="14" style="vertical-align:-2px"')} ${esc(p.email)}</div>${p.phone?`<div class="mu">${ico('phone').replace('<svg','<svg width="14" height="14" style="vertical-align:-2px"')} ${esc(p.phone)}</div>`:''}
      ${S.adm?'<div style="margin-top:8px"><span class="chip">Admin</span></div>':''}</div>
      <div class="kp"><div class="card"><b>${mine.length}</b><span class="mu">Pesanan</span></div><div class="card"><b>${mine.filter(o => stIdx(o) === 6).length}</b><span class="mu">Selesai</span></div></div>
      <div class="card"><label class="f" for="pnm" style="margin-top:0">Nama</label><input id="pnm" maxlength="100" value="${esc(p.name)}"><label class="f" for="pph">No. telepon</label><input id="pph" maxlength="20" inputmode="tel" value="${esc(p.phone)}"><button class="btn gh w" style="margin-top:12px" data-a="saveprof">${ico('check')} Simpan profil</button></div>
      <div class="btns"><button class="btn gh" data-a="theme">${ico(isDark()?'sun':'moon')} ${isDark()?'Mode terang':'Mode gelap'}</button><button class="btn gh" data-a="logout">${ico('logout')} Keluar</button></div>`;
  }
  const reg = S.auth === 'reg';
  return head('Akun', reg ? 'Daftar akun baru' : 'Masuk ke akunmu') +
  `<div class="card"><div class="chips"><button class="${reg?'':'on'}" data-a="auth" data-i="login">Masuk</button><button class="${reg?'on':''}" data-a="auth" data-i="reg">Daftar</button></div>
    ${reg ? `<label class="f" for="an">Nama</label><input id="an" maxlength="100" autocomplete="name"><label class="f" for="ah">No. telepon</label><input id="ah" maxlength="20" inputmode="tel" autocomplete="tel" placeholder="08xxxxxxxxxx">` : ''}
    <label class="f" for="ae">Email</label><input id="ae" type="email" autocomplete="email">
    <label class="f" for="ap">Password</label><input id="ap" type="password" autocomplete="${reg?'new-password':'current-password'}" placeholder="Minimal 6 karakter">
    <button class="btn w" style="margin-top:16px" data-a="${reg?'reg':'login'}" ${S.busy?'disabled':''}>${reg?'Daftar sekarang':'Masuk'} ${ico('arrow')}</button>
    ${reg ? '' : '<div style="text-align:center;margin-top:10px"><a href="#" data-a="reset">Lupa password?</a></div>'}</div>`;
},

adm: () => {
  const sub = [['rekap','Rekap','chart'],['order','Order','box'],['wh','Warehouse','warehouse'],['web','Website','edit'],['ide','Ide','bulb']];
  return head('Admin','Panel pengelola') + `<div class="chips">${sub.map(s => `<button class="${S.at===s[0]?'on':''}" data-a="at" data-i="${s[0]}">${s[1]}</button>`).join('')}</div>` + (A[S.at] || A.rekap)();
}
};

/* ---------- Admin views ---------- */
const invTotal = i => Number(i.total||0) + Number(i.ongkir||0);
const A = {
rekap: () => {
  const O = S.orders, conf = S.invs.filter(i => i.confirmed);
  const by = ST.map(s => O.filter(o => (o.status||ST[0]) === s).length);
  const waiting = S.pays.filter(p => !p.verified && (S.orders.find(o => o.id === p.oid)||{}).status === ST[4]).length;
  return `<div class="kp" style="margin-top:8px">
    <div class="card"><b>${O.length}</b><span class="mu">Total order</span></div>
    <div class="card"><b>${rp(conf.reduce((s,i) => s + invTotal(i), 0))}</b><span class="mu">Nilai invoice terkonfirmasi</span></div>
    <div class="card"><b>${rp(S.invs.reduce((s,i) => s + invTotal(i), 0))}</b><span class="mu">Nilai semua invoice</span></div>
    <div class="card"><b>${waiting}</b><span class="mu">Bukti bayar menunggu</span></div></div>
  <div class="card"><b>Jumlah per status</b>${ST.map((s,i) => `<div class="ln"><div class="t">${i+1}. ${s}</div><b>${by[i]}</b></div>`).join('')}
    <div class="btns" style="margin-top:12px"><button class="btn" data-a="csv">${ico('download')} Unduh CSV</button></div>
    <div class="mu" style="margin-top:8px">Untuk tarikan otomatis ke Google Sheets, pakai file <b>sheets.gs</b> (lihat README).</div></div>`;
},
wh: () => {
  const O = S.orders;
  return `<div class="card"><b>Warehouse Tracking · 5 negara</b><div class="mu">Jumlah order per negara dan tahap.</div><div class="tw" style="margin-top:10px"><table>
    <thead><tr><th>Negara</th><th>Total</th>${ST_SHORT.map(s => `<th>${s}</th>`).join('')}</tr></thead>
    <tbody>${NEG.map(n => { const w = O.filter(o => o.country === n); return `<tr><td><span class="chip">${NEG_CODE[n]}</span> ${n}</td><td><b>${w.length}</b></td>${ST.map(s => { const c = w.filter(o => (o.status||ST[0]) === s).length; return `<td>${c ? `<b>${c}</b>` : '<span class="mu">0</span>'}</td>`; }).join('')}</tr>`; }).join('')}</tbody></table></div></div>`;
},
order: () => {
  const q = S.aq.toLowerCase();
  const list = S.orders.filter(o => !q || [o.id, o.buyer, o.rcp, o.email, o.status].join(' ').toLowerCase().includes(q));
  const o = S.orders.find(x => x.id === S.sel);
  return `<div class="adm2"><div class="card" style="padding:12px"><input id="aq" placeholder="Cari kode / nama / status" value="${esc(S.aq)}" data-live="aq">
    <div style="max-height:560px;overflow:auto;margin-top:8px">${list.map(x => `<div class="al ${S.sel===x.id?'on':''}" data-a="sel" data-i="${esc(x.id)}">${bub(ST_ICON[stIdx(x)],'s')}<div class="t"><b>#${esc(x.id)}</b><div class="mu" style="font-size:12px">${esc(x.buyer||'-')} · ${esc(ST_SHORT[stIdx(x)])}${paysOf(x).some(p=>!p.verified)&&stIdx(x)===4?' · <b style="color:var(--lb)">bukti masuk</b>':''}</div></div></div>`).join('') || '<div class="mu" style="padding:10px">Belum ada order.</div>'}</div></div>
    <div>${o ? adminOrder(o) : `<div class="card empty">${bub('box','l')}<h3>Pilih order</h3><p class="mu">Pilih order di daftar untuk mengelola tracking, invoice, dan pembayaran.</p></div>`}</div></div>`;
},
web: () => {
  const s = S.site;
  return `<div class="card"><b>Isi website</b>
    <label class="f" for="e1">Judul beranda</label><input id="e1" maxlength="120" value="${esc(s.title)}">
    <label class="f" for="e2">Subjudul</label><textarea id="e2" maxlength="400">${esc(s.sub)}</textarea>
    <label class="f" for="e3">Pengumuman</label><textarea id="e3" maxlength="600">${esc(s.notice)}</textarea>
    <label class="f" for="e4">Langkah cara order <span class="mu">(satu per baris, format: Judul | Deskripsi)</span></label><textarea id="e4" style="min-height:140px">${esc(s.cara)}</textarea>
    <label class="f" for="e5">Syarat & Ketentuan</label><textarea id="e5" style="min-height:160px">${esc(s.tnc)}</textarea>
    <label class="f" for="e6">Info rekening / QRIS</label><textarea id="e6">${esc(s.payInfo)}</textarea>
    <button class="btn w" style="margin-top:14px" data-a="site">${ico('check')} Simpan perubahan</button></div>
  <div class="card"><b>Logo</b><div class="row" style="justify-content:flex-start;margin:10px 0"><img src="${esc(img(s.logo) || '/.netlify/images?url=/logo.jpg&w=240&fm=webp')}" alt="Logo saat ini" style="height:64px;border-radius:14px"></div>
    <input id="lf" type="file" accept="image/*"><div class="btns" style="margin-top:10px"><button class="btn" data-a="logo">${ico('upload')} Ganti logo</button>${s.logo?`<button class="btn gh" data-a="logoreset">Kembalikan logo awal</button>`:''}</div></div>
  <div class="card"><b>Gambar QRIS</b>${safeUrl(s.qris)?`<div><img src="${esc(safeUrl(s.qris))}" alt="QRIS" style="width:160px;border-radius:14px;margin:10px 0;background:#fff"></div>`:'<div class="mu">Belum ada gambar QRIS.</div>'}
    <input id="qf" type="file" accept="image/*"><button class="btn" style="margin-top:10px" data-a="qris">${ico('upload')} Unggah QRIS</button></div>
  <div class="mu">Kelola produk langsung dari tab Katalog (form tambah/edit muncul untuk admin).</div>`;
},
ide: () => `${S.ideas.length ? S.ideas.map(i => `<div class="card"><div class="row"><b>${esc(i.t)}</b><span class="mu" style="font-size:12px">${dd(i.at)}</span></div><div class="mu">${esc(i.name||'')} · ${esc(i.email||'')}</div><div class="pre" style="margin-top:6px">${esc(i.d)}</div><div class="btns" style="margin-top:8px"><button class="btn gh sm" data-a="delide" data-i="${esc(i.id)}">${ico('trash')} Hapus</button></div></div>`).join('') : `<div class="card empty">${bub('bulb','l')}<h3>Belum ada ide masuk</h3></div>`}`
};

function adminOrder(o) {
  const k = stIdx(o), inv = invOf(o), ps = paysOf(o);
  return `<div class="card"><div class="row"><div><b style="font-size:18px">#${esc(o.id)}</b><div class="mu">${esc(o.buyer||'')} · ${esc(o.email||'')} · ${esc(o.phone||'')}</div></div><span class="chip">${esc(ST[k])}</span></div>
    ${details(o)}
    <label class="f" for="ms">Ubah status manual</label><div class="row"><select id="ms">${ST.map((s,i) => `<option value="${i}" ${i===k?'selected':''}>${i+1}. ${s}</option>`).join('')}</select><button class="btn gh sm" data-a="setst" data-i="${esc(o.id)}">Ubah</button></div></div>

  <div class="card"><b>Update tracking</b>
    <label class="f" for="us">Tahap</label><select id="us">${ST.map((s,i) => `<option value="${i}" ${i===Math.min(k+1,6)?'selected':''}>${i+1}. ${s}${STAGE_HINT[i]?' — '+STAGE_HINT[i]:''}</option>`).join('')}</select>
    <label class="f" for="ur">No resi LN</label><input id="ur" maxlength="80" value="${esc(o.resi||'')}">
    <label class="f" for="un">Catatan tahap</label><textarea id="un" maxlength="800" placeholder="mis. Masuk BOX 16 · 2,4 kg"></textarea>
    <label class="f" for="ul">Link CO Shopee</label><input id="ul" maxlength="400" value="${esc(o.coLink||'')}" placeholder="https://shopee.co.id/...">
    <label class="f" for="uf">Foto (bisa beberapa)</label><input id="uf" type="file" accept="image/*" multiple>
    <button class="btn w" style="margin-top:12px" data-a="tl" data-i="${esc(o.id)}" ${S.busy?'disabled':''}>${ico('check')} Simpan tahap</button></div>

  <div class="card"><b>Invoice</b>${inv ? `
    <div class="mu">${esc(inv.no)} · ${inv.confirmed ? 'sudah terlihat customer' : 'belum terlihat customer'}</div>
    <div class="g2"><div><label class="f" for="it1">Subtotal barang</label><input id="it1" inputmode="numeric" value="${esc(inv.total||0)}"></div><div><label class="f" for="it2">Ongkir & biaya</label><input id="it2" inputmode="numeric" value="${esc(inv.ongkir||0)}"></div></div>
    <label class="f" for="it3">Catatan invoice</label><input id="it3" maxlength="300" value="${esc(inv.note||'')}">
    <div class="btns" style="margin-top:12px">${inv.confirmed ? `<button class="btn gh" data-a="invsave" data-i="${esc(o.id)}">Simpan invoice</button>` : `<button class="btn" data-a="invconf" data-i="${esc(o.id)}">${ico('check')} Konfirmasi invoice</button>`}</div>` : '<div class="mu">Invoice belum terbentuk (jalankan schema.sql terbaru).</div>'}</div>

  <div class="card"><b>Pembayaran</b>${ps.length ? ps.map(p => `<div class="ln"><div class="t"><b>${dt(p.at)}</b><div class="mu">${esc(p.note||'Tanpa catatan')}</div></div><button class="btn gh sm" data-a="viewbukti" data-i="${esc(p.id)}">${ico('img')} Lihat</button>${p.verified?'<span class="chip ok">Terverifikasi</span>':''}</div>`).join('') +
    (ps.some(p => !p.verified) ? `<button class="btn w" style="margin-top:10px" data-a="verif" data-i="${esc(o.id)}">${ico('check')} Verifikasi pembayaran</button>` : '') : '<div class="mu">Belum ada bukti pembayaran.</div>'}</div>

  <div class="card"><b>Timeline (pratinjau customer)</b>${timeline(o)}<div class="btns"><button class="btn gh sm" data-a="delorder" data-i="${esc(o.id)}">${ico('trash')} Hapus order</button></div></div>`;
}

/* ---------- Aksi ---------- */
const findO = id => S.orders.find(o => o.id === id);
async function refresh(msg) { await load(); draw(true); if (msg) toast(msg); }
async function run(fn) { if (S.busy) return; S.busy = true; try { await fn(); } catch(e) { console.error(e); toast(errMsg(e)); } finally { S.busy = false; } }
const needReady = () => { if (!READY) { toast('Supabase belum dihubungkan'); return false; } return true; };

async function saveOrder(o, patch) { const n = {...clean(o), ...patch}; await kv.upd('orders', o.id, n); }

const ACT = {
  theme() { localStorage.setItem('jk_theme', isDark() ? 'light' : 'dark'); applyTheme(); draw(true); },
  auth(i) { S.auth = i; draw(true); },
  async reg() { if (!needReady()) return; const e = val('ae').toLowerCase(), pw = $('#ap').value, n = val('an'), ph = val('ah');
    if (!n || !e || pw.length < 6) return toast('Isi nama, email, dan password (min. 6 karakter)');
    if (ph && !/^[+\d][\d\s-]{6,19}$/.test(ph)) return toast('No. telepon tidak valid');
    const r = await SB.auth.signUp({ email:e, password:pw, options:{ data:{ name:n, phone:ph }, emailRedirectTo: location.origin } });
    if (r.error) throw r.error;
    if (!r.data.session) { S.auth = 'login'; draw(true); toast('Cek email untuk verifikasi, lalu masuk'); } },
  async login() { if (!needReady()) return; const e = val('ae').toLowerCase(), pw = $('#ap').value;
    if (!e || !pw) return toast('Isi email dan password');
    const r = await SB.auth.signInWithPassword({ email:e, password:pw }); if (r.error) throw new Error('Email atau password salah'); },
  async reset() { if (!needReady()) return; const e = val('ae').toLowerCase(); if (!e) return toast('Isi email dulu');
    const r = await SB.auth.resetPasswordForEmail(e, { redirectTo: location.origin + '/#akun' }); if (r.error) throw r.error; toast('Link reset password dikirim ke email'); },
  async logout() { await SB.auth.signOut(); },
  async saveprof() { const n = val('pnm'), ph = val('pph'); if (!n) return toast('Nama wajib diisi');
    const r = await SB.auth.updateUser({ data:{ name:n, phone:ph } }); if (r.error) throw r.error; S.user = r.data.user; draw(true); toast('Profil tersimpan'); },

  kf(i) { S.kf = i; draw(true); },
  tocart(i) { const p = S.prods.find(x => x.id === i); if (!p) return; const ex = S.cart.find(c => c.pid === p.id);
    if (ex) ex.q++; else S.cart.push({ pid:p.id, n:p.n, q:1, p:Number(p.p)||0, c:p.c||NEG[0] }); saveCart(); toast('Masuk daftar pesanan'); if (S.v === 'order') draw(true); },
  addman() { const n = val('mn'); if (!n) return toast('Isi nama barang');
    S.cart.push({ n, note:val('md'), q:Math.max(1, Math.round(num('mq'))||1), p:num('mp'), c:val('mc') || NEG[0] }); saveCart(); draw(true); toast('Ditambahkan ke daftar'); },
  qp(i) { S.cart[+i].q++; saveCart(); draw(true); },
  qm(i) { if (S.cart[+i].q > 1) S.cart[+i].q--; saveCart(); draw(true); },
  rm(i) { S.cart.splice(+i, 1); saveCart(); draw(true); },
  async checkout() { if (!needReady()) return;
    if (!S.cart.length) return toast('Daftar pesanan masih kosong');
    const rcp = val('or'), hp = val('oh'), addr = val('oa');
    if (!rcp || !hp || !addr) return toast('Lengkapi nama penerima, no. HP, dan alamat');
    const p = profile(), id = rid('JK'), now = Date.now();
    const cnt = {}; S.cart.forEach(i => cnt[i.c] = (cnt[i.c]||0) + i.q);
    const country = Object.keys(cnt).sort((a,b) => cnt[b]-cnt[a])[0];
    await kv.ins('orders', id, { buyer:p.name, email:p.email, phone:p.phone, rcp, hp, addr,
      ship: (document.querySelector('input[name=os]:checked')||{}).value || SHIP[0],
      pay: (document.querySelector('input[name=op]:checked')||{}).value || 'Transfer',
      shopNo: val('ot'), items: S.cart.map(i => ({ n:i.n, q:i.q, p:i.p, c:i.c, note:i.note||'' })),
      country, status:ST[0], resi:'', coLink:'', at:now, tl:{ 0:{ note:'Pesanan diterima sistem.', at:now } } });
    S.cart = []; saveCart(); S.open = id; S.v = 'trk'; history.replaceState(null,'','#trk');
    await refresh('Pesanan dibuat! Kode: ' + id); },

  toggle(i) { S.open = S.open === i ? null : i; draw(true); },
  find() { S.tq = val('tq'); const q = S.tq.toUpperCase().replace(/^#/,''); const m = S.orders.find(o => o.id.toUpperCase() === q); if (m) S.open = m.id; draw(true); },
  payopen(i) { S.pf = i; draw(true); },
  payclose() { S.pf = null; draw(true); },
  async paysend(i) { const f = $('#pb').files[0]; if (!f) return toast('Pilih foto bukti transfer');
    const path = await upload('bukti', f);
    await kv.ins('payments', rid('PAY'), { oid:i, path, note:val('pm'), at:Date.now(), verified:false });
    S.pf = null; await refresh('Bukti pembayaran terkirim'); },

  async addide() { if (!needReady()) return; const t = val('it'), d = val('id'); if (!t) return toast('Isi judul ide');
    const p = profile(); await kv.ins('ideas', rid('IDE'), { t, d, name:p.name, email:p.email, at:Date.now() }); await refresh('Ide terkirim, terima kasih!'); },

  /* Admin */
  at(i) { S.at = i; draw(true); },
  sel(i) { S.sel = i; draw(true); },
  async saveprod() { const n = val('pn'); if (!n) return toast('Isi nama produk');
    const old = S.ep ? S.prods.find(p => p.id === S.ep) : null; const f = $('#pi').files[0];
    const im = f ? await upload('photos', f) : (old && old.img) || '';
    await kv.put('products', S.ep || rid('P'), { n, p:num('pp'), c:val('pc'), d:val('pd'), img:im });
    S.ep = null; await refresh('Produk tersimpan'); },
  editprod(i) { S.ep = i; draw(true); scrollTo({top:0, behavior:'smooth'}); },
  cancelprod() { S.ep = null; draw(true); },
  async delprod(i) { if (!confirm('Hapus produk ini?')) return; await kv.del('products', i); await refresh('Produk dihapus'); },
  async setst(i) { const o = findO(i), k = +val('ms'); const tl = {...(o.tl||{})}; tl[k] = {...(tl[k]||{}), at:(tl[k]||{}).at || Date.now()};
    await saveOrder(o, { status:ST[k], tl }); await refresh('Status diubah'); },
  async tl(i) { const o = findO(i), k = +val('us'), files = [...$('#uf').files], ph = [];
    for (const f of files) ph.push(await upload('photos', f));
    const tl = {...(o.tl||{})}, old = tl[k] || {};
    tl[k] = { note: val('un') || old.note || '', ph:[...(old.ph||[]), ...ph], at: old.at || Date.now() };
    await saveOrder(o, { tl, status:ST[k], resi:val('ur'), coLink: /^https?:\/\//i.test(val('ul')) ? val('ul') : '' });
    await refresh('Tahap tracking disimpan'); },
  async invsave(i, conf) { const inv = S.invs.find(x => x.id === i);
    await kv.upd('invoices', i, {...clean(inv), total:num('it1'), ongkir:num('it2'), note:val('it3'), confirmed: conf || !!inv.confirmed, ...(conf ? {confirmedAt:Date.now()} : {})});
    await refresh(conf ? 'Invoice dikonfirmasi & terlihat customer' : 'Invoice disimpan'); },
  async invconf(i) { await ACT.invsave(i, true); },
  async viewbukti(i) { const p = S.pays.find(x => x.id === i); const w = window.open('', '_blank');
    const { data, error } = await SB.storage.from('bukti').createSignedUrl(p.path, 600); if (error) { if (w) w.close(); throw error; }
    if (w) { w.opener = null; w.location = data.signedUrl; } else location.href = data.signedUrl; },
  async verif(i) { const o = findO(i);
    for (const p of paysOf(o).filter(p => !p.verified)) await kv.upd('payments', p.id, {...clean(p), verified:true, verifiedAt:Date.now()});
    const tl = {...(o.tl||{})}; tl[5] = {...(tl[5]||{}), note:(tl[5]||{}).note || 'Pembayaran terverifikasi. Paket sedang dikirim ke alamatmu.', at:Date.now()};
    await saveOrder(o, { status:ST[5], tl }); await refresh('Pembayaran terverifikasi'); },
  async delorder(i) { if (!confirm('Hapus order #' + i + ' beserta invoice dan pembayarannya?')) return;
    await kv.del('orders', i); await kv.del('invoices', i).catch(()=>{}); for (const p of S.pays.filter(p => p.oid === i)) await kv.del('payments', p.id).catch(()=>{});
    S.sel = null; await refresh('Order dihapus'); },
  async site() { await kv.put('site', 'main', {...clean(S.site), title:val('e1'), sub:val('e2'), notice:val('e3'), cara:$('#e4').value, tnc:$('#e5').value, payInfo:$('#e6').value}); await refresh('Isi website tersimpan'); },
  async logo() { const url = await upload('photos', $('#lf').files[0]); await kv.put('site', 'main', {...clean(S.site), logo:url}); await refresh('Logo diganti'); },
  async logoreset() { await kv.put('site', 'main', {...clean(S.site), logo:''}); await refresh('Logo awal dipakai lagi'); },
  async qris() { const url = await upload('photos', $('#qf').files[0]); await kv.put('site', 'main', {...clean(S.site), qris:url}); await refresh('QRIS diperbarui'); },
  async delide(i) { if (!confirm('Hapus ide ini?')) return; await kv.del('ideas', i); await refresh('Ide dihapus'); },
  csv() {
    const q = x => { let s = String(x ?? ''); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g,'""') + '"'; };
    const r = [['Kode','Tanggal','Pembeli','Email','HP','Penerima','Alamat','Negara','Metode kirim','No pesanan toko','Pembayaran','Status','Resi LN','Barang','Estimasi','No invoice','Invoice dikonfirmasi','Total invoice','Bukti bayar']];
    S.orders.forEach(o => { const inv = invOf(o) || {}, ps = paysOf(o);
      r.push([o.id, dd(o.at), o.buyer, o.email, o.hp || o.phone, o.rcp, o.addr, o.country, o.ship, o.shopNo, o.pay, o.status, o.resi, (o.items||[]).map(i => `${i.n} x${i.q}`).join('; '), tot(o.items), inv.no||'', inv.confirmed?'Ya':'Belum', inv.no ? invTotal(inv) : '', ps.length ? (ps.some(p=>p.verified)?'Terverifikasi':'Menunggu') : '-']); });
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + r.map(x => x.map(q).join(',')).join('\r\n')], {type:'text/csv;charset=utf-8'}));
    a.download = `rekap-juseikr-${new Date().toISOString().slice(0,10)}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
};

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const fn = ACT[b.dataset.a]; if (!fn) return;
  if (b.tagName === 'A') e.preventDefault();
  run(async () => fn(b.dataset.i));
});
document.addEventListener('input', e => { const k = e.target.dataset.live; if (!k) return; S[k] = e.target.value;
  const pos = e.target.selectionStart; draw(true); const n = document.getElementById(e.target.id); if (n) { n.focus(); n.setSelectionRange(pos, pos); } });
document.addEventListener('keydown', e => { if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
  if (e.target.id === 'tq') ACT.find(); if (e.target.id === 'ap') run(() => S.auth === 'reg' ? ACT.reg() : ACT.login()); });
addEventListener('hashchange', () => { const v = location.hash.slice(1); if (/^[a-z]+$/.test(v) && v !== S.v) { S.v = v; draw(true); } });
init();
</script>
</body>
</html>
